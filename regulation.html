```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Regulation</title>

    <link rel="shortcut icon" href="images-removebg-preview.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Iceberg&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           BODY
        ============================== */

        body {
            min-height: 100vh;

            font-family: "Inter", sans-serif;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 40px 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(9, 20, 40, 0.94),
                    rgba(11, 77, 92, 0.90)
                ),
                url("bolack img.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            /* SCROLL ENABLED */
            overflow-x: hidden;
            overflow-y: auto;

            position: relative;
        }


        /* ==============================
           BACKGROUND EFFECTS
        ============================== */

        body::before {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: rgba(6, 182, 212, 0.18);

            filter: blur(90px);

            top: -150px;
            left: -120px;

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(32, 45, 77, 0.25);

            filter: blur(90px);

            bottom: -150px;
            right: -100px;

            pointer-events: none;
        }


        /* ==============================
           MAIN CARD
        ============================== */

        .card {
            width: min(900px, 90%);

            min-height: 570px;

            margin: 20px auto 50px;

            padding: 45px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.97),
                    rgba(245, 250, 252, 0.93)
                );

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(6, 182, 212, 0.15);

            backdrop-filter: blur(15px);

            text-align: center;

            position: relative;

            z-index: 2;

            animation: cardEntry 0.8s ease;
        }


        /* ==============================
           CARD ANIMATION
        ============================== */

        @keyframes cardEntry {

            from {
                opacity: 0;
                transform: translateY(35px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* ==============================
           BADGE
        ============================== */

        .badge {
            width: 72px;
            height: 72px;

            margin: 0 auto 20px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #202d4d,
                    #06b6d4
                );

            color: white;

            font-family: "Iceberg", sans-serif;

            font-size: 30px;

            box-shadow:
                0 12px 25px rgba(6, 182, 212, 0.28);
        }


        /* ==============================
           HEADING
        ============================== */

        .card h1 {
            font-family: "Iceberg", sans-serif;

            font-size: clamp(32px, 5vw, 48px);

            letter-spacing: 2px;

            color: #202d4d;

            margin-bottom: 10px;
        }


        /* ==============================
           SUBTITLE
        ============================== */

        .subtitle {
            color: #64748b;

            font-size: 15px;

            margin-bottom: 38px;
        }


        /* ==============================
           REGULATION GRID
        ============================== */

        .regulations {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 22px;

            margin-top: 20px;
        }


        /* ==============================
           REGULATION CARD
        ============================== */

        .regulation {
            min-height: 180px;

            padding: 25px 18px;

            border-radius: 20px;

            background: white;

            border: 1px solid #e2e8f0;

            text-decoration: none;

            color: #202d4d;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            position: relative;

            overflow: hidden;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

            box-shadow:
                0 8px 20px rgba(15, 23, 42, 0.07);
        }


        /* TOP LINE */

        .regulation::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #202d4d,
                    #06b6d4
                );
        }


        /* ==============================
           HOVER EFFECT
        ============================== */

        .regulation:hover {
            transform: translateY(-9px);

            border-color: #06b6d4;

            box-shadow:
                0 18px 35px rgba(6, 182, 212, 0.20);
        }


        /* ==============================
           YEAR
        ============================== */

        .year {
            font-family: "Iceberg", sans-serif;

            font-size: 45px;

            font-weight: 400;

            color: #202d4d;

            margin-bottom: 8px;
        }


        /* ==============================
           REGULATION TEXT
        ============================== */

        .regulation-name {
            font-size: 13px;

            color: #64748b;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* ==============================
           ARROW
        ============================== */

        .arrow {
            margin-top: 15px;

            font-size: 20px;

            color: #06b6d4;

            transition: transform 0.3s ease;
        }


        .regulation:hover .arrow {
            transform: translateX(7px);
        }


        /* ==============================
           DISABLED CARD
        ============================== */

        .disabled {
            opacity: 0.55;

            cursor: not-allowed;
        }


        .disabled:hover {
            transform: none;

            border-color: #e2e8f0;

            box-shadow:
                0 8px 20px rgba(15, 23, 42, 0.07);
        }


        .disabled .year {
            color: #94a3b8;
        }


        /* ==============================
           FOOTER
        ============================== */

        .footer {
            margin-top: 38px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;

            color: #94a3b8;

            font-size: 12px;

            letter-spacing: 0.5px;
        }


        /* ==============================
           CUSTOM SCROLLBAR
        ============================== */

        ::-webkit-scrollbar {
            width: 10px;
        }


        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.15);
        }


        ::-webkit-scrollbar-thumb {
            background:
                linear-gradient(
                    180deg,
                    #202d4d,
                    #06b6d4
                );

            border-radius: 20px;

            border: 2px solid transparent;

            background-clip: padding-box;
        }


        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;

            background-clip: padding-box;
        }


        /* Firefox */

        html {
            scrollbar-width: thin;

            scrollbar-color:
                #06b6d4
                rgba(15, 23, 42, 0.15);
        }


        /* ==============================
           TABLET
        ============================== */

        @media (min-width: 701px) and (max-width: 850px) {

            .regulations {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            body {
                padding: 20px 12px;

                align-items: flex-start;

                overflow-y: auto;

                background-attachment: scroll;
            }


            .card {
                width: 100%;

                min-height: auto;

                padding: 30px 20px;

                margin: 10px auto 30px;

                border-radius: 22px;
            }


            .badge {
                width: 60px;
                height: 60px;

                font-size: 25px;
            }


            .card h1 {
                font-size: 32px;

                letter-spacing: 1px;
            }


            .subtitle {
                font-size: 13px;

                line-height: 1.6;

                margin-bottom: 25px;
            }


            .regulations {
                grid-template-columns: 1fr;

                gap: 15px;
            }


            .regulation {
                min-height: 140px;
            }


            .year {
                font-size: 38px;
            }


            .footer {
                margin-top: 25px;
            }

        }


        /* ==============================
           SMALL MOBILE
        ============================== */

        @media (max-width: 400px) {

            body {
                padding: 10px;
            }


            .card {
                padding: 25px 15px;
            }


            .card h1 {
                font-size: 27px;
            }


            .regulation {
                min-height: 125px;
            }

        }

    </style>
</head>


<body>

        </div>


        <!-- HEADING -->

        </h1>


        <!-- DESCRIPTION -->

        <p class="subtitle">

        </p>


        <!-- REGULATIONS -->

        <div class="regulations">

            <a href="dept21.html" class="regulation">

                <div class="year">

                </div>

                <div class="regulation-name">

                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <!-- 2024 -->

            <a href="dept24.html" class="regulation">

                <div class="year">
                    2024
                </div>

                <div class="regulation-name">
                    Regulation
                </div>

                <div class="arrow">

                </div>

            </a>

            <div class="regulation disabled">

                <div class="year">

                </div>

                <div class="regulation-name">

                <div class="arrow">

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="footer">
            Academic Regulation Portal
        </div>

    </main>

</body>

</html>
